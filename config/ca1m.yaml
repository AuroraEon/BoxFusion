dataset: CA1M

data:
  datadir: ./data/example/42898570  # change this to your data_root for CA-1M dataset like:  YOUR_DATA_ROOT/CA-1M/42446540/
  start: 0 
  output_dir: ./results
  gap: 20


cam:
  H: 384
  W: 512
  png_depth_scale: 1000.


detection:
  score_thresh: 0.4 
  uv_bound: True
  uv_bound_value: 0.9
  floor_mask: True 
  floor_ratio: 15
  scale_box: 1.5

association:
  small_threshold: 0.2
  rotation_gap: 30 
  translation_gap: 0.8 

room_segmentation:
  tracking_iou_threshold: 0.3
  tracking_missed_cycles: 2
  tier2_enablement_mode: off
  tier2_manual_enable: false
  tier2_central_roi: [919, 889, 1227, 1106]
  tier2_small_region_area_ratio_thresh: 0.2
  tier2_newborn_age_thresh: 2
  tier2_cut_support_thresh: 0.25
  tier2_dominant_neighbor_ratio_thresh: 0.6
  tier2_cooldown_ttl: 300
  tier2_cooldown_seed_strength_thresh: 0.65
  tier2_cooldown_bbox_margin_px: 12
  tier2_cooldown_persistent_seed_frames: 2
  tier2_region_match_coverage_thresh: 0.6
  tier2_region_match_area_ratio_max: 2.5



box_fusion:
  use: True 
  iters: 20 
  pst_path: ./data/pst_1024_0.tiff
  pst_size: 1024
  random_opt:
    center_init_size: 0.1 
    center_scaling_coefficient: 0.1 
    shape_init_size: 0.5 
    shape_scaling_coefficient: 0.5 
  check_valid: False
  nms_threshold: 0.1 
  small_size: 0.5 


vis:
  rerun: True # visualization, set to False for acceleration
  show_class: False # show object class
  show_label: False # show box id
  trajectory: True

eval: False #True
